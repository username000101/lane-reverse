name: lane_app
description: "Native cross-platform client for Lane Music API with Telegram Auth flow."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  crypto: ^3.0.3
  uuid: ^4.3.3
  qr_flutter: ^4.1.0
  url_launcher: ^6.2.5
  just_audio: ^0.9.36
  just_audio_windows: ^0.2.2
  audio_session: ^0.1.18
  cached_network_image: ^3.3.1
  shared_preferences: ^2.2.2
  flutter_riverpod: ^2.5.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
