[package]
name = "laned-bot"
version.workspace = true
edition.workspace = true

[dependencies]
laned-bnit = { path = "../laned-bnit" }
tokio = { version = "1.40", features = ["full"] }
grammers-client = { version = "0.11.0", features = ["fs", "html"] }
grammers-session = "0.11.0"
grammers-mtsender = "0.11.0"
grammers-tl-types = "0.11.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
url = "2.5"
log = "0.4"
env_logger = "0.11"
futures-util = "0.3"
tempfile = "3.10"
id3 = "1.14"
